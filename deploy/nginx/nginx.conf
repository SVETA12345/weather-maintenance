# Базовый конфиг обратного прокси. Файл из репозитория монтируется в контейнер
# read-only, поэтому любые правки идут через git.
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Реальный IP клиента — $remote_addr (его значение кладёт в X-Real-IP сам nginx).
    # Значение заголовка X-Forwarded-For в лог пишется отдельно только для диагностики:
    # клиент может его подделать, авторитетным источником остаётся $remote_addr.
    # $request_id совпадает с идентификатором запроса в логах приложения, поэтому
    # можно связать запись nginx с записью pino-http по одному значению.
    log_format  main  '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                      'rt=$request_time urt=$upstream_response_time rid=$request_id '
                      'upstream=$upstream_addr xff="$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65s;
    server_tokens   off;
    reset_timedout_connection on;

    # Сжатие ответов. JSON метрик и API сжимается заметно, мелкие ответы
    # (< 1 КБ) не трогаем, чтобы не добавлять overhead на каждый запрос.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Таймауты и заголовки для всех проксируемых location (см. conf.d/app.conf).
    # connect — до бэкенда, send/read — обмен с ним. Значения взяты с запасом
    # относительно HEALTH_DB_TIMEOUT_MS=2000 и REQUEST_TIMEOUT_MS=5000 в приложении.
    proxy_connect_timeout  5s;
    proxy_send_timeout     60s;
    proxy_read_timeout     60s;
    send_timeout           60s;

    include /etc/nginx/conf.d/*.conf;
}