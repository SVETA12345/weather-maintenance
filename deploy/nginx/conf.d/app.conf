# Основной сервер: приложение, документация, статика и служебные пути.
# Публикуется наружу как ${NGINX_PORT:-8080} (HTTP) и ${NGINX_HTTPS_PORT:-8443} (HTTPS).
#
# Два блока server {} намеренно разделены: по HTTP отдаётся только служебный
# путь и редирект, всё содержимое — исключительно по TLS. Смешивать их в одном
# блоке нельзя, иначе часть трафика утекала бы наружу без шифрования.

upstream app_api {
    server api:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # Служебный путь: проверка живости самого прокси (её использует healthcheck).
    # Оставлен на HTTP, чтобы проверка не зависела от состояния сертификата.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Всё остальное — на HTTPS. Порт в редиректе задан явно (8443), потому что
    # 443 на хосте может быть занят другим сервисом; он совпадает со значением
    # NGINX_HTTPS_PORT в docker-compose.yml. Меняешь порт — меняй и здесь.
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # --- Сертификат ---
    # Каталог certs/ монтируется из репозитория read-only. Файлы кладёт mkcert
    # (см. README, раздел про HTTPS), они НЕ отслеживаются git.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Ограничение размера тела запроса. Приложение принимает JSON (заявки,
    # оборудование, отчёты), 1 МБ — с запасом; превышение даёт 413, а не чтение
    # тела в память целиком. Файлы статики этот лимит не касаются.
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Заголовки реального клиента. X-Forwarded-For дописывает $remote_addr
    # справа, поэтому клиентская подмена значения слева игнорируется приложением
    # (express берёт крайний правый адрес при TRUST_PROXY=1). Приложение читает
    # эти заголовки только потому, что включило доверие прокси (TRUST_PROXY=1).
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Request-Id      $request_id;

    # Метрики приложения для Prometheus: доступны только с разрешённых адресов
    # (monitoring-allow.inc). Внутренний scrape ходит напрямую на api:3000,
    # поэтому правило не мешает сбору данных.
    location = /metrics {
        access_log off;
        include /etc/nginx/conf.d/monitoring-allow.inc;
        proxy_pass http://app_api;
    }

    # Документация OpenAPI: Swagger UI (/api/docs/) и спецификация
    # (/api/docs/openapi.json). Отдельный location нужен, чтобы правила
    # документации (rate limit, кэш ресурсов UI) не смешивались с общими
    # для /api.
    location ^~ /api/docs {
        proxy_pass http://app_api;
    }

    # API. Трафик приложения сюда попадает через правило catch-all ниже;
    # явное разделение оставлено, чтобы его легко было ужесточить отдельно
    # (например, отключить rate limit для доверенной сети).
    location ^~ /api/ {
        proxy_pass http://app_api;
    }

    # Статика: приложение само раздаёт public/ (index.html и app.js).
    location = / {
        proxy_pass http://app_api;
    }

    # Всё остальное — тоже приложение: favicon.ico, /app.js, 404.
    location / {
        proxy_pass http://app_api;
    }
}