# Интерфейсы мониторинга на отдельных портах того же контейнера nginx.
#
# Порты совпадают с прежними прямыми публикациями (localhost:9090 / :9093 / :3001),
# поэтому адреса в README и дашбордах не меняются, но доступ теперь идёт через прокси
# и ограничен списком адресов из monitoring-allow.inc.
#
# Подпуть не используется намеренно: Grafana под /grafana и Prometheus под
# /prometheus генерируют абсолютные ссылки без префикса и сломались бы. Отдельные
# порты дешевле и не требуют менять root_url и --web.route-prefix.

upstream prometheus_ui {
    server prometheus:9090;
}

upstream alertmanager_ui {
    server alertmanager:9093;
}

upstream grafana_ui {
    server grafana:3000;
}

server {
    listen 9090;
    server_name _;

    location / {
        include /etc/nginx/conf.d/monitoring-allow.inc;
        proxy_pass http://prometheus_ui;
    }
}

server {
    listen 9093;
    server_name _;

    location / {
        include /etc/nginx/conf.d/monitoring-allow.inc;
        proxy_pass http://alertmanager_ui;
    }
}

server {
    listen 3001;
    server_name _;

    location / {
        include /etc/nginx/conf.d/monitoring-allow.inc;
        proxy_pass http://grafana_ui;
    }
}