# Alertmanager: получатель оповещений по почте.
#
# Значения вида @@TOKEN@@ подставляет monitoring/alertmanager/render-config.sh
# при старте контейнера из переменных окружения compose. Alertmanager сам
# переменные окружения в конфигурации не раскрывает, поэтому шаблон нужно
# отрендерить (иначе в smarthost попадёт буквальное `${ALERT_SMTP_HOST}`).
#
# Без настроенного SMTP правила всё равно срабатывают и видны в Prometheus и
# Grafana, но письма не уходят (см. README, раздел «Оповещения»).
global:
  resolve_timeout: 5m

route:
  receiver: default
  # Свои alertname в группе не смешиваются: недоступность API и медленные ответы
  # приходят разными письмами.
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    email_configs:
      - to: '@@ALERT_EMAIL_TO@@'
        from: '@@ALERT_EMAIL_FROM@@'
        smarthost: '@@ALERT_SMTP_HOST@@:@@ALERT_SMTP_PORT@@'
        auth_username: '@@ALERT_SMTP_USER@@'
        auth_password: '@@ALERT_SMTP_PASSWORD@@'
        # Включать в контурах, где SMTP требует TLS ( порт 587 + STARTTLS).
        require_tls: @@ALERT_SMTP_REQUIRE_TLS@@