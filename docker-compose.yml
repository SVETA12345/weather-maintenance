services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: weather-maintenance-api:latest
    container_name: weather-maintenance-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Значения ниже перекрывают .env, если заданы в шелле
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
